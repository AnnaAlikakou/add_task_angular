<div class="container custom-container">
    <div class="mt-3">
        <div class="row">
            <div class="col">
                <h1 class="text-center mb-5">Book your Next Appointment/Task</h1>
            </div>
        </div>
        <div class="row book">
            <div class="col-md-6">
                <input class="form-control" [(ngModel)]="newAppointmentTitle" placeholder="Title">
            </div>
            <div class="col-md-4">
                <input class="form-control" [(ngModel)]="newAppointmentDate" type="date" placeholder="Date">
            </div>
            <div class="col-md-2">
                <button class="btn-add w-100" (click)="addAppointment()" >Add</button>
            </div>
        </div>
    </div>

    <div class="mt-3">
    <h2 class="text-center mb-5">Appointments/Tasks</h2>
    <ul class="list-group">
    <li class="list-group-item" *ngFor="let appointment of appointments; index as i">
       {{appointment.title}} {{appointment.date | date: 'dd.MM.yyyy'}}
       <button class="btn btn-dark" (click)="deleteAppointment(i)">Remove</button>
    </li>
</ul>
</div>
<div class="last">Created for educational purposes</div>
</div>
